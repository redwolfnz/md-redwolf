name: Generate weekly content

# Step 2 of the pipeline (PIPE-2026Q3.yml).
# Calls the Mac mini listener (via Cloudflare Tunnel) which runs gen_posts.py
# and returns 6 generated posts as JSON. This Action appends them to the CSV,
# commits on a content branch, and opens a PR.
#
# Requires repo secrets:
#   GENERATE_CONTENT_URL    — Cloudflare Tunnel URL for the /generate-content endpoint
#   CF_ACCESS_CLIENT_ID     — Cloudflare Access service token ID
#   CF_ACCESS_CLIENT_SECRET — Cloudflare Access service token secret
#   LISTENER_SHARED_SECRET  — shared secret verified by listener.py

on:
  schedule:
    - cron: '0 20 * * 1'   # Monday 8pm UTC = Tuesday 8am NZST (UTC+12)
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week number (leave blank to use current week)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Compute week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "num=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            echo "num=$(python3 -c 'from datetime import date; print(date.today().isocalendar()[1])')" >> $GITHUB_OUTPUT
          fi

      - name: Create content branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b content/w${{ steps.week.outputs.num }}-batch

      - name: Generate posts via Mac mini
        env:
          GENERATE_CONTENT_URL: ${{ secrets.GENERATE_CONTENT_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LISTENER_SHARED_SECRET: ${{ secrets.LISTENER_SHARED_SECRET }}
          CONTENT_WEEK: ${{ steps.week.outputs.num }}
        run: python3 .github/scripts/gen_posts.py

      - name: Commit generated posts
        run: |
          WEEK=${{ steps.week.outputs.num }}
          RANGE=$(python3 -c "
          import csv
          rows = list(csv.DictReader(open('COULD/TABLE-2026Q3.csv')))
          week_rows = [r for r in rows if r['week'] == '$WEEK']
          if week_rows:
              items = [r['item'] for r in week_rows]
              print(f'{items[0]} to {items[-1]}')
          else:
              print('no posts')
          ")
          git add COULD/TABLE-2026Q3.csv
          git commit -m "content(w${WEEK}): generate week ${WEEK} batch — ${RANGE}"
          for attempt in 1 2 3; do
            if git push origin content/w${WEEK}-batch; then
              break
            fi
            echo "Push rejected (attempt $attempt) — retrying..."
            git fetch origin content/w${WEEK}-batch 2>/dev/null || true
            git rebase origin/content/w${WEEK}-batch 2>/dev/null || true
          done

      - name: Generate PR body
        run: python3 .github/scripts/gen_pr_body.py ${{ steps.week.outputs.num }} > /tmp/pr_body.md

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=${{ steps.week.outputs.num }}
          gh pr create \
            --title "content(w${WEEK}): week ${WEEK} batch" \
            --body-file /tmp/pr_body.md \
            --base main \
            --head content/w${WEEK}-batch
