name: Generate weekly content

# Step 2 of the pipeline (PIPE-2026Q3.yml).
# Calls the Mac mini listener (via Cloudflare Tunnel) which runs gen_posts.py
# and returns 6 generated posts as JSON. This Action appends them to the CSV,
# commits directly to main, and opens a GitHub Issue with the batch summary
# (issues can be permanently deleted; PRs cannot).
#
# Step 2D (generate-media) runs after the commit. It calls the Mac mini
# /generate-media endpoint (same tunnel as generate-content). The Mac mini
# runs generate_media.py which calls claude -p to produce SVG per post,
# renders to PNG/PDF/GIF, and returns files as base64. gen_media.py writes
# them to MAY/media/2026Q3/ and updates the CSV media URL column.
#
# Requires repo secrets:
#   GENERATE_CONTENT_URL    — Cloudflare Tunnel URL for the /generate-content endpoint
#   CF_ACCESS_CLIENT_ID     — Cloudflare Access service token ID
#   CF_ACCESS_CLIENT_SECRET — Cloudflare Access service token secret
#   LISTENER_SHARED_SECRET  — shared secret verified by listener.py
#   (Step 2D uses the Mac mini's Claude login — no additional secrets needed)

on:
  schedule:
    - cron: '0 20 * * 1'   # Monday 8pm UTC = Tuesday 8am NZST (UTC+12)
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week number (leave blank to use current week)'
        required: false
      replace:
        description: 'Replace that week''s existing rows (redo a batch) instead of appending'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      week: ${{ steps.week.outputs.num }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Compute week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "num=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            echo "num=$(python3 -c 'from datetime import date; print(date.today().isocalendar()[1])')" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Refresh subtype values from feedback
        run: python3 .github/scripts/update_tree_values.py

      - name: Generate posts via Mac mini
        env:
          GENERATE_CONTENT_URL: ${{ secrets.GENERATE_CONTENT_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LISTENER_SHARED_SECRET: ${{ secrets.LISTENER_SHARED_SECRET }}
          CONTENT_WEEK: ${{ steps.week.outputs.num }}
          CONTENT_REPLACE: ${{ github.event.inputs.replace }}
        run: python3 .github/scripts/gen_posts.py

      - name: Commit generated posts
        run: |
          WEEK=${{ steps.week.outputs.num }}
          RANGE=$(python3 -c "
          import csv
          rows = list(csv.DictReader(open('COULD/TABLE-2026Q3.csv')))
          week_rows = [r for r in rows if r['week'] == '$WEEK']
          if week_rows:
              items = [r['item'] for r in week_rows]
              print(f'{items[0]} to {items[-1]}')
          else:
              print('no posts')
          ")
          git add COULD/TABLE-2026Q3.csv CAN/TREE-2026Q3.json
          git commit -m "content(w${WEEK}): generate week ${WEEK} batch — ${RANGE}"
          # Push directly to main; rebase-retry handles concurrent bot commits.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            sleep 5
          done

      - name: Generate issue body
        run: python3 .github/scripts/gen_pr_body.py ${{ steps.week.outputs.num }} > /tmp/issue_body.md

      - name: Open issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=${{ steps.week.outputs.num }}
          TITLE="content(w${WEEK}): week ${WEEK} batch"
          gh issue create --title "$TITLE" --body-file /tmp/issue_body.md

  # generate-media: ON HOLD — run manually via generate-media.yml workflow
