name: update-tree-mermaid

# When CAN/TREE-2026Q3.json changes on a branch that has an open PR,
# replaces the Mermaid block (between <!-- TREE-START --> and
# <!-- TREE-END --> markers) in that PR's description.
# Update the paths filter at quarter rollover.

on:
  push:
    branches-ignore: [main]
    paths:
      - 'CAN/TREE-2026Q3.json'
  workflow_dispatch: {}

permissions:
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Find open PR for this branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER=$(gh pr list \
            --head "${{ github.ref_name }}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "number=$NUMBER" >> $GITHUB_OUTPUT

      - name: Generate Mermaid block
        if: steps.pr.outputs.number != ''
        run: python3 .github/scripts/gen_tree_mermaid.py > /tmp/mermaid.md

      - name: Replace Mermaid section in PR description
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          python3 .github/scripts/replace_tree_section.py \
            "$PR_NUMBER" \
            /tmp/mermaid.md
